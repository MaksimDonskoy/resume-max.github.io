<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog — MONO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --black:#0a0a0a; --white:#fafafa; --gray:#666; --line:rgba(0,0,0,.12); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--white);color:var(--black)}
    a{text-decoration:none;color:inherit}
    header{display:flex;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);font-family:"Bodoni Moda",serif}
    .toolbar{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
    .filters{display:flex;gap:20px;color:var(--gray)}
    .filters .on{color:var(--black);border-bottom:1px solid var(--black);padding-bottom:4px}
    .catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 20px;padding:40px 32px 80px}
    .product{cursor:pointer}
    .img{aspect-ratio:3/4;background:#ddd;margin-bottom:14px}
    .product:nth-child(2) .img{background:#111}
    .product:nth-child(4) .img{background:#222}
    .product:nth-child(6) .img{background:#eee}
    h2{font-family:"Bodoni Moda",serif;font-size:1.25rem;font-weight:400;margin-bottom:4px}
    .meta{font-size:12px;color:var(--gray);display:flex;justify-content:space-between}
    @media(max-width:768px){.catalog{grid-template-columns:1fr 1fr}.filters{display:none}}
  </style>
</head>
<body>
  <header>
    <a href="index.html">MONO</a>
    <a href="index.html" style="font-family:Inter,sans-serif;font-size:12px;letter-spacing:.12em">← Home</a>
  </header>
  <div class="toolbar">
    <span>All · 24 pieces</span>
    <div class="filters">
      <span class="on">Outerwear</span>
      <span>Knitwear</span>
      <span>Trousers</span>
      <span>Accessories</span>
    </div>
    <span>Sort: Featured</span>
  </div>
  <main class="catalog">
    <article class="product">
      <div class="img"></div>
      <h2>Column Coat</h2>
      <div class="meta"><span>Cashmere blend</span><span>€690</span></div>
    </article>
    <article class="product">
      <div class="img"></div>
      <h2>Line Blazer</h2>
      <div class="meta"><span>Wool twill</span><span>€420</span></div>
    </article>
    <article class="product">
      <div class="img"></div>
      <h2>Frame Trouser</h2>
      <div class="meta"><span>Cotton sateen</span><span>€240</span></div>
    </article>
    <article class="product">
      <div class="img"></div>
      <h2>Mono Knit</h2>
      <div class="meta"><span>Merino</span><span>€190</span></div>
    </article>
    <article class="product">
      <div class="img"></div>
      <h2>Plate Shirt</h2>
      <div class="meta"><span>Poplin</span><span>€160</span></div>
    </article>
    <article class="product">
      <div class="img"></div>
      <h2>Arc Tote</h2>
      <div class="meta"><span>Vegetable leather</span><span>€310</span></div>
    </article>
  </main>
</body>
</html>
