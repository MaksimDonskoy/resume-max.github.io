<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  body{margin:0;background:#0b0d12;color:#fff;font-family:Inter,sans-serif}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tile{border-radius:28px;padding:28px;display:grid;align-content:space-between;border:1px solid rgba(255,255,255,.08)}
  .logo{width:120px;height:120px}.logo svg{width:100%;height:100%}
  h2{margin:0;font-size:28px} p{opacity:.75}
  </style></head><body><section class="board" data-card>
  <div class="tile" style="background:#052e16"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#052e16"/><path d="M36 78c18-34 30-46 48-54-8 22-6 40 2 54-18 2-34-2-50 0Z" fill="#22c55e"/><circle cx="78" cy="34" r="8" fill="#86efac"/></svg></div><div><h2>Dark</h2><p>Primary logo on dark</p></div></div>
  <div class="tile" style="background:#ecfdf5;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#052e16"/><path d="M36 78c18-34 30-46 48-54-8 22-6 40 2 54-18 2-34-2-50 0Z" fill="#22c55e"/><circle cx="78" cy="34" r="8" fill="#86efac"/></svg></div><div><h2>Light</h2><p>Primary logo on light</p></div></div>
  <div class="tile" style="background:#22c55e;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#052e16"/><path d="M36 78c18-34 30-46 48-54-8 22-6 40 2 54-18 2-34-2-50 0Z" fill="#22c55e"/><circle cx="78" cy="34" r="8" fill="#86efac"/></svg></div><div><h2>Accent</h2><p>Brand mark on accent field</p></div></div>
  </section></body></html>
