<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  body{margin:0;background:#0b0d12;color:#fff;font-family:Inter,sans-serif}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tile{border-radius:28px;padding:28px;display:grid;align-content:space-between;border:1px solid rgba(255,255,255,.08)}
  .logo{width:120px;height:120px}.logo svg{width:100%;height:100%}
  h2{margin:0;font-size:28px} p{opacity:.75}
  </style></head><body><section class="board" data-card>
  <div class="tile" style="background:#020617"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#020617"/><path d="M28 84 L60 28 L92 84" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="84" r="8" fill="#e2e8f0"/></svg></div><div><h2>Dark</h2><p>Primary logo on dark</p></div></div>
  <div class="tile" style="background:#e2e8f0;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#020617"/><path d="M28 84 L60 28 L92 84" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="84" r="8" fill="#e2e8f0"/></svg></div><div><h2>Light</h2><p>Primary logo on light</p></div></div>
  <div class="tile" style="background:#38bdf8;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#020617"/><path d="M28 84 L60 28 L92 84" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="84" r="8" fill="#e2e8f0"/></svg></div><div><h2>Accent</h2><p>Brand mark on accent field</p></div></div>
  </section></body></html>
