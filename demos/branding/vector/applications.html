<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  body{margin:0;background:#0b0d12;color:#fff;font-family:Inter,sans-serif}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
  .card,.bag,.card2{border-radius:28px;padding:32px;border:1px solid rgba(255,255,255,.08)}
  .card{background:linear-gradient(160deg,#020617,#111)}
  .bag{background:#e2e8f0;color:#111;display:grid;place-items:center;text-align:center}
  .card2{background:#111827}
  .logo{width:100px;height:100px;margin-bottom:18px}.logo svg{width:100%;height:100%}
  h1{font-size:42px;margin:0 0 10px} p{opacity:.8;line-height:1.5}
  </style></head><body><section class="board" data-card>
  <div class="card"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#020617"/><path d="M28 84 L60 28 L92 84" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="84" r="8" fill="#e2e8f0"/></svg></div><h1>VECTOR</h1><p>Systems that scale</p><p>Business card · demo mock</p></div>
  <div class="bag"><div><div class="logo" style="margin:0 auto 16px"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#020617"/><path d="M28 84 L60 28 L92 84" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="84" r="8" fill="#e2e8f0"/></svg></div><strong>VECTOR</strong><p>Shopping bag / packaging face</p></div></div>
  </section></body></html>
