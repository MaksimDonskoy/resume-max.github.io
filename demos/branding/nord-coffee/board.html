<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap');
  *{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:#0b0d12;color:#fff}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;background:linear-gradient(145deg,#111827,#0b0d12 55%,#111)}
  .panel{border:1px solid rgba(255,255,255,.08);border-radius:28px;background:rgba(255,255,255,.03);padding:28px}
  .logo{width:180px;height:180px}.logo svg{width:100%;height:100%}
  h1{font-family:"Space Grotesk",sans-serif;font-size:56px;margin:18px 0 8px}
  .tag{opacity:.8;font-size:22px}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
  .swatch{height:92px;border-radius:18px;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:700}
  .apps{display:grid;gap:16px}.app{height:140px;border-radius:18px;display:grid;place-items:center;font-weight:700;letter-spacing:.08em}
  .mono{display:flex;gap:18px;align-items:center}.mono .word{font-family:"Space Grotesk",sans-serif;font-size:42px;font-weight:700}
  .note{margin-top:18px;opacity:.65;font-size:14px}
  </style></head><body><section class="board" data-card>
  <div class="panel"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#1c1917"/><circle cx="60" cy="58" r="28" fill="none" stroke="#b45309" stroke-width="8"/><path d="M86 58c10 0 18 8 18 18" fill="none" stroke="#f5f5f4" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="58" r="10" fill="#f5f5f4"/></svg></div><h1>NORD COFFEE</h1><p class="tag">Nordic roast · quiet mornings</p>
  <div class="swatches"><div class="swatch" style="background:#1c1917;color:#fff">#1c1917</div><div class="swatch" style="background:#f5f5f4;color:#111">#f5f5f4</div><div class="swatch" style="background:#b45309;color:#fff">#b45309</div><div class="swatch" style="background:#78716c;color:#fff">#78716c</div></div>
  <p class="note">Demo brand system · original mark for portfolio</p></div>
  <div class="panel apps">
    <div class="app" style="background:#1c1917;color:#f5f5f4">PRIMARY LOCKUP</div>
    <div class="mono"><div class="logo" style="width:84px;height:84px"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#1c1917"/><circle cx="60" cy="58" r="28" fill="none" stroke="#b45309" stroke-width="8"/><path d="M86 58c10 0 18 8 18 18" fill="none" stroke="#f5f5f4" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="58" r="10" fill="#f5f5f4"/></svg></div><div class="word">NORD COFFEE</div></div>
    <div class="app" style="background:#f5f5f4;color:#1c1917">PACKAGING / SIGNAGE MOCK SLOT</div>
    <div class="app" style="background:#b45309;color:#111">ACCENT APPLICATION</div>
  </div></section></body></html>
