<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  body{margin:0;background:#0b0d12;color:#fff;font-family:Inter,sans-serif}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tile{border-radius:28px;padding:28px;display:grid;align-content:space-between;border:1px solid rgba(255,255,255,.08)}
  .logo{width:120px;height:120px}.logo svg{width:100%;height:100%}
  h2{margin:0;font-size:28px} p{opacity:.75}
  </style></head><body><section class="board" data-card>

  <div class="tile" style="background:#f5f5f4;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#1c1917"/><circle cx="60" cy="58" r="28" fill="none" stroke="#b45309" stroke-width="8"/><path d="M86 58c10 0 18 8 18 18" fill="none" stroke="#f5f5f4" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="58" r="10" fill="#f5f5f4"/></svg></div><div><h2>Light</h2><p>Primary logo on light</p></div></div>
  <div class="tile" style="background:#b45309;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#1c1917"/><circle cx="60" cy="58" r="28" fill="none" stroke="#b45309" stroke-width="8"/><path d="M86 58c10 0 18 8 18 18" fill="none" stroke="#f5f5f4" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="58" r="10" fill="#f5f5f4"/></svg></div><div><h2>Accent</h2><p>Brand mark on accent field</p></div></div>
  </section></body></html>
