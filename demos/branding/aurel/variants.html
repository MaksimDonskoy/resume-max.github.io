<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  body{margin:0;background:#0b0d12;color:#fff;font-family:Inter,sans-serif}
  .board{width:1400px;height:900px;padding:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tile{border-radius:28px;padding:28px;display:grid;align-content:space-between;border:1px solid rgba(255,255,255,.08)}
  .logo{width:120px;height:120px}.logo svg{width:100%;height:100%}
  h2{margin:0;font-size:28px} p{opacity:.75}
  </style></head><body><section class="board" data-card>
  <div class="tile" style="background:#3b0764"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#3b0764"/><circle cx="60" cy="60" r="26" fill="none" stroke="#e879f9" stroke-width="6"/><path d="M60 28v64M28 60h64" stroke="#f5d0fe" stroke-width="4"/><circle cx="60" cy="60" r="8" fill="#fdf4ff"/></svg></div><div><h2>Dark</h2><p>Primary logo on dark</p></div></div>
  <div class="tile" style="background:#fdf4ff;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#3b0764"/><circle cx="60" cy="60" r="26" fill="none" stroke="#e879f9" stroke-width="6"/><path d="M60 28v64M28 60h64" stroke="#f5d0fe" stroke-width="4"/><circle cx="60" cy="60" r="8" fill="#fdf4ff"/></svg></div><div><h2>Light</h2><p>Primary logo on light</p></div></div>
  <div class="tile" style="background:#e879f9;color:#111"><div class="logo"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="#3b0764"/><circle cx="60" cy="60" r="26" fill="none" stroke="#e879f9" stroke-width="6"/><path d="M60 28v64M28 60h64" stroke="#f5d0fe" stroke-width="4"/><circle cx="60" cy="60" r="8" fill="#fdf4ff"/></svg></div><div><h2>Accent</h2><p>Brand mark on accent field</p></div></div>
  </section></body></html>
