<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Flow</title>
<style>
:root{--accent:#22c55e;--bg:#0c1018;--panel:#151c28;--text:#eef3ff;--muted:#95a3b8;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.demo-badge{position:fixed;right:16px;bottom:16px;z-index:99;padding:8px 12px;border-radius:999px;background:rgba(255,196,64,.16);border:1px solid rgba(255,196,64,.45);color:#ffd977;font-size:12px;font-weight:800;letter-spacing:.08em;pointer-events:none}
button,input,select,textarea{font:inherit}button{cursor:pointer}

</style></head><body data-app>
<div data-device style="width:390px;min-height:844px;margin:0 auto;background:#0a0f17;border-radius:28px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;border:1px solid #243044">
<header style="padding:16px 18px;background:#111827"><strong>Money Flow</strong><p style="margin:4px 0 0;font-size:12px;color:var(--muted)">mobile demo</p></header>
<main id="app"><section class="screen" data-screen="0"  style="padding:18px;display:grid;gap:12px;align-content:start">
<h2 style="margin:0;font-size:22px">Баланс</h2><h3 style="margin:0;font-size:34px">$3 420</h3><p style="color:var(--muted)">Демо-данные</p></section><section class="screen" data-screen="1" hidden style="padding:18px;display:grid;gap:12px;align-content:start">
<h2 style="margin:0;font-size:22px">История</h2><ul style="margin:0;padding:0;list-style:none;display:grid;gap:8px"><li style="padding:10px;background:var(--panel);border-radius:12px">Кафе −$12</li><li style="padding:10px;background:var(--panel);border-radius:12px">Зарплата +$2 100</li></ul></section><section class="screen" data-screen="2" hidden style="padding:18px;display:grid;gap:12px;align-content:start">
<h2 style="margin:0;font-size:22px">Накопления</h2><div style="height:12px;border-radius:999px;background:#1f2937"><div style="width:62%;height:100%;border-radius:999px;background:var(--accent)"></div></div><p style="margin:8px 0 0">62% до отпуска</p></section></main>
<nav style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-top:1px solid #243044;background:#0f1624"><button class="nav" data-go="0">Сводка</button><button class="nav" data-go="1">Операции</button><button class="nav" data-go="2">Цели</button></nav>
</div>
<style>.nav{padding:10px 6px;border:0;border-radius:12px;background:#172033;color:var(--text);font-size:11px}.nav.is-on{background:var(--accent);color:#061018;font-weight:700}</style>
<script>
function show(i){document.querySelectorAll('.screen').forEach(s=>s.hidden=Number(s.dataset.screen)!==i);document.querySelectorAll('.nav').forEach((n,idx)=>n.classList.toggle('is-on',idx===i));}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.go))));show(0);
</script>
<div class="demo-badge">DEMO</div>
<script>window.waitForDemoReady=true;document.documentElement.dataset.ready='1';</script></body></html>
