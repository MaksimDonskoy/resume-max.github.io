<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Connect</title>
<style>
:root{--accent:#fbbf24;--bg:#0c1018;--panel:#151c28;--text:#eef3ff;--muted:#95a3b8;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.demo-badge{position:fixed;right:16px;bottom:16px;z-index:99;padding:8px 12px;border-radius:999px;background:rgba(255,196,64,.16);border:1px solid rgba(255,196,64,.45);color:#ffd977;font-size:12px;font-weight:800;letter-spacing:.08em;pointer-events:none}
button,input,select,textarea{font:inherit}button{cursor:pointer}

</style></head><body data-app>
<div data-dashboard style="min-height:900px;padding:28px 32px;display:grid;gap:18px">
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1 style="margin:0;font-size:28px">CRM Connect</h1><p style="margin:6px 0 0;color:var(--muted)">Automation demo dashboard</p></div><button data-run style="padding:10px 14px;border:0;border-radius:12px;background:var(--accent);color:#061018;font-weight:800">Запустить демо-run</button></header>
<div style="display:flex;gap:10px;flex-wrap:wrap"><input data-search placeholder="Поиск..." style="padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#101827;color:var(--text);min-width:220px"><select data-status style="padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#101827;color:var(--text)"><option value="all">Все статусы</option><option value="ok">OK</option><option value="warn">WARN</option><option value="fail">FAIL</option></select></div>
<div style="display:grid;grid-template-columns:1.4fr .8fr;gap:16px">
<table style="width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden"><thead><tr style="background:#111827;text-align:left"><th style="padding:12px">Job</th><th style="padding:12px">Status</th><th style="padding:12px">Latency</th></tr></thead><tbody id="rows"><tr data-status="ok"><td style="padding:12px;border-top:1px solid var(--line)">CRM Connect · Sync catalog</td><td style="padding:12px;border-top:1px solid var(--line);color:#4ade80">OK</td><td style="padding:12px;border-top:1px solid var(--line)">120ms</td></tr><tr data-status="warn"><td style="padding:12px;border-top:1px solid var(--line)">CRM Connect · Push prices</td><td style="padding:12px;border-top:1px solid var(--line);color:#fbbf24">WARN</td><td style="padding:12px;border-top:1px solid var(--line)">157ms</td></tr><tr data-status="ok"><td style="padding:12px;border-top:1px solid var(--line)">CRM Connect · Webhook retry</td><td style="padding:12px;border-top:1px solid var(--line);color:#4ade80">OK</td><td style="padding:12px;border-top:1px solid var(--line)">194ms</td></tr><tr data-status="fail"><td style="padding:12px;border-top:1px solid var(--line)">CRM Connect · Lead import</td><td style="padding:12px;border-top:1px solid var(--line);color:#f87171">FAIL</td><td style="padding:12px;border-top:1px solid var(--line)">231ms</td></tr><tr data-status="ok"><td style="padding:12px;border-top:1px solid var(--line)">CRM Connect · Report export</td><td style="padding:12px;border-top:1px solid var(--line);color:#4ade80">OK</td><td style="padding:12px;border-top:1px solid var(--line)">268ms</td></tr></tbody></table>
<div style="padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)"><h3 style="margin:0 0 10px">Throughput</h3><svg viewBox="0 0 320 120" width="100%" height="120" aria-hidden="true"><polyline points="0,90 40,70 80,78 120,40 160,55 200,30 240,48 280,20 320,35" fill="none" stroke="#fbbf24" stroke-width="4"/></svg><p data-runlog style="margin:10px 0 0;color:var(--muted);font-size:13px">Ожидание запуска...</p></div>
</div>
</div>
<script>
const body=document.getElementById('rows');
document.querySelector('[data-run]').addEventListener('click',()=>{document.querySelector('[data-runlog]').textContent='Run #'+(Math.floor(Math.random()*900)+100)+' завершён за '+(1+Math.random()*2).toFixed(1)+'s (демо)';});
document.querySelector('[data-search]').addEventListener('input',e=>{const q=e.target.value.toLowerCase();[...body.querySelectorAll('tr')].forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q));});
document.querySelector('[data-status]').addEventListener('change',e=>{const v=e.target.value;[...body.querySelectorAll('tr')].forEach(tr=>{const st=tr.dataset.status||'ok';tr.hidden=v!=='all'&&st!==v;});});
</script>
<div class="demo-badge">DEMO</div>
<script>window.waitForDemoReady=true;document.documentElement.dataset.ready='1';</script></body></html>
